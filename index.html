<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UX Portfolio · Melina Karanika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f6f6f8;--surface:#fff;--line:#e2e5eb;--fg:#14171f;--fg-2:#434a58;--muted:#687080;--me:#5b4cdb;--me-soft:#efecfd;--bad:#a8261b;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 1px 2px rgba(20,23,31,.04),0 12px 32px -20px rgba(20,23,31,.18)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--me)}
h1{font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:10px 0 8px}
p{margin:0;color:var(--fg-2);font-size:14.5px;line-height:1.6}
form{margin-top:24px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;font-weight:500}
input{font:inherit;font-family:var(--mono);font-size:20px;letter-spacing:.3em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
input:focus{outline:2px solid var(--me);outline-offset:1px;border-color:transparent}
button{font:inherit;font-weight:600;font-size:15px;padding:12px 16px;border:0;border-radius:10px;background:var(--me);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em}
.back{display:inline-block;margin-top:20px;font-size:13.5px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--me)}
</style>
</head>
<body>
<main class="card" id="card">
  <span class="eyebrow">Melina Karanika</span>
  <h1>UX Portfolio</h1>
  <p>This portfolio is passcode protected. Enter the passcode you received with my application.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Passcode</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" required autofocus>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">View portfolio</button>
  </form>
</main>

  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open(code){
