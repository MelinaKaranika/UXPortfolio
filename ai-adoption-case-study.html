<style>
:root{--bg:#0e0e0f;--win:#171718;--win2:#1e1e20;--ink:#f3f2ee;--dim:#a1a0a6;--line:#2f2f32;--vio:#8b7dff;--peach:#ffb994;--k:#050507;--bad:#ff8f80;
--pix:"Silkscreen",ui-monospace,monospace;--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
background-color:var(--bg);background-image:radial-gradient(rgba(139,125,255,.09) 1px,transparent 1.2px),radial-gradient(ellipse at 28% 18%,rgba(139,125,255,.06) 0,transparent 60%),radial-gradient(ellipse at 85% 90%,rgba(255,185,148,.04) 0,transparent 55%);background-size:16px 16px,auto,auto;background-attachment:fixed}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.12) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.top,.bot{display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--bg)}
.top{height:56px;border-bottom:2px solid var(--ink)}
.top b{font-weight:700;font-size:15px}
.top span{color:var(--dim);font-weight:500;font-size:15px}
.top span:before{content:"/";margin-right:12px;opacity:.5}
.bot{height:52px;justify-content:space-between;font-size:13px;font-weight:500}
.bot .lock{display:flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--ink);font-weight:600;font-size:13.5px}
.bot .tray{display:flex;align-items:center;gap:10px}
.bot .tray i{width:8px;height:8px;border-radius:50%;background:#72d39c}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.win{width:100%;max-width:440px;background:var(--win);border:1px solid var(--ink);box-shadow:8px 10px 18px rgba(0,0,0,.55)}
.tb{display:flex;align-items:center;height:30px;padding:0 8px;background:var(--vio);color:var(--k);border-bottom:1px solid var(--ink)}
.tb h2{margin:0 auto;font:600 13px var(--sans)}
.tb i{width:18px;height:18px;border:1px solid var(--k);display:grid;place-items:center;font:700 11px/1 var(--sans);font-style:normal}
.tb .sp{width:18px}
.body{padding:28px 28px 30px}
.icon{display:block;margin-bottom:18px}
h1{font:700 clamp(24px,4vw,30px)/1.15 var(--pix);margin:0 0 10px}
p{margin:0;color:var(--dim);font-size:15px}
form{margin-top:24px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;font-weight:600;color:var(--ink)}
input{font:500 20px var(--sans);letter-spacing:.3em;padding:12px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--vio);outline-offset:1px;border-color:transparent}
button{font:600 15px var(--sans);padding:13px 16px;border:1px solid var(--k);background:var(--vio);color:var(--k);cursor:pointer;box-shadow:4px 4px 0 var(--k)}
button:hover,button:focus-visible{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--k);outline:none}
button:disabled{opacity:.6;cursor:progress;transform:none}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em}
.prompt{margin-top:18px;font-size:13px;color:var(--dim)}
.cur{display:inline-block;width:8px;height:15px;background:var(--vio);vertical-align:-3px;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
@media(max-width:520px){.top span{display:none}.top,.bot{padding:0 20px}.body{padding:22px}}
</style>
</head>

  var KEY="portfolio-unlock";
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function open(code){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  async function worker(key){

    if(!("serviceWorker" in navigator))return;
    try{
      navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&e.data.type==="mk-need-key"&&e.ports[0])e.ports[0].postMessage(window.__mkKey||null)});
